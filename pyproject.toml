[project]
name = "cloud-flight-fare-pipeline"
version = "0.1.0"
description = "End-to-end AWS flight fare data pipeline with ECS/Fargate, S3, Redshift Serverless, dbt, EventBridge Scheduler, and CloudWatch proof"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.ruff]
line-length = 100



[tool.ruff.lint]
# Explicit rule set so CI does not change when ruff updates its defaults.
# E4/E7/E9/F: ruff's long-standing defaults; I: import sorting; UP: pyupgrade.
select = ["E4", "E7", "E9", "F", "I", "UP"]